<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eromart Hover Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .navbar {
      background-color: green; /* No background */
    }

    .navbar-brand {
      font-weight: bold;
      color: #000;
    }

    .navbar-nav .nav-link {
      color: #000;
    }

    .navbar-nav .nav-link:hover {
      color: #ff6600;
    }

    .dropdown:hover .dropdown-menu {
      display: block;
      margin-top: 0;
    }

    .dropdown-menu {
      margin-top: 100px;
      border: none;
      background-color: yellow;
      box-shadow: none;
    }

    .dropdown-item {
      color: #000;
    }

    .dropdown-item:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <!-- <a class="navbar-brand" href="#">EROMART</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
        <span class="navbar-toggler-icon"></span>
      </button> -->

      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About Us</a>
          </li>
 
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#">Cash Counting Machines</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Fake Note Detector</a></li>
              <li><a class="dropdown-item" href="#">Bill Counter</a></li>
              <li><a class="dropdown-item" href="#">Note Counting Machine</a></li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#">Billing Machines</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Handheld Billing</a></li>
              <li><a class="dropdown-item" href="#">Desktop Billing</a></li>
            </ul>
          </li>
          
          <li class="nav-item">
            <a class="nav-link" href="#">Gallery</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
